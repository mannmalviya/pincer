<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- masks cut a small triangular notch into each claw so they read as open pincers -->
  <defs>
    <mask id="leftClawNotch">
      <rect width="64" height="64" fill="white"/>
      <polygon points="13,18 3,15 13,21" fill="black"/>
    </mask>
    <mask id="rightClawNotch">
      <rect width="64" height="64" fill="white"/>
      <polygon points="51,18 61,15 51,21" fill="black"/>
    </mask>
  </defs>

  <!-- antennae -->
  <path d="M27 22 Q23 14 19 11" stroke="#CC5200" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M37 22 Q41 14 45 11" stroke="#CC5200" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <circle cx="19" cy="11" r="1.3" fill="#CC5200"/>
  <circle cx="45" cy="11" r="1.3" fill="#CC5200"/>

  <!-- left claw arm + claw -->
  <path d="M21 33 Q14 28 12 22" stroke="#FF6600" stroke-width="4" stroke-linecap="round" fill="none"/>
  <ellipse cx="9" cy="18" rx="6" ry="7" fill="#FF6600" mask="url(#leftClawNotch)"/>

  <!-- right claw arm + claw -->
  <path d="M43 33 Q50 28 52 22" stroke="#FF6600" stroke-width="4" stroke-linecap="round" fill="none"/>
  <ellipse cx="55" cy="18" rx="6" ry="7" fill="#FF6600" mask="url(#rightClawNotch)"/>

  <!-- chubby body -->
  <ellipse cx="32" cy="38" rx="15" ry="14" fill="#FF6600"/>
  <!-- soft highlight to give it a glossy, friendly feel -->
  <ellipse cx="27" cy="33" rx="5" ry="3.5" fill="#FF8533" opacity="0.7"/>
  <!-- belly band hints at lobster segmentation without being busy -->
  <path d="M19 42 Q32 47 45 42" stroke="#E55B00" stroke-width="0.9" fill="none" stroke-linecap="round"/>

  <!-- tiny legs -->
  <path d="M22 50 L20 55" stroke="#CC5200" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M28 51 L27 56" stroke="#CC5200" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M36 51 L37 56" stroke="#CC5200" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M42 50 L44 55" stroke="#CC5200" stroke-width="1.4" stroke-linecap="round"/>

  <!-- face -->
  <circle cx="27" cy="37" r="2.6" fill="white"/>
  <circle cx="37" cy="37" r="2.6" fill="white"/>
  <circle cx="27.5" cy="37.5" r="1.5" fill="#1a1a1a"/>
  <circle cx="37.5" cy="37.5" r="1.5" fill="#1a1a1a"/>
  <circle cx="28" cy="37" r="0.6" fill="white"/>
  <circle cx="38" cy="37" r="0.6" fill="white"/>
  <path d="M30 42 Q32 44 34 42" stroke="#1a1a1a" stroke-width="0.9" stroke-linecap="round" fill="none"/>
</svg>
